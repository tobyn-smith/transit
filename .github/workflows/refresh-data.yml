name: Refresh data

# Re-pulls the Eurostat gas import dependency and demand figures on a schedule
# and rebuilds the site only if either has changed. Runs monthly, or on demand.

on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::eurostat
            any::dplyr
            any::readr

      - name: Pull the latest Eurostat gas figures
        run: Rscript scripts/03_eurostat.R

      # 03_eurostat.R writes both the dependence and the demand tables, so a
      # change to either should commit and rebuild the site.
      - name: Commit and trigger a rebuild if the data changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain data/processed/import_dependence.csv data/processed/gas_demand.csv)" ]; then
            git config user.name "tobyn-smith"
            git config user.email "298003421+tobyn-smith@users.noreply.github.com"
            git add data/processed/import_dependence.csv data/processed/gas_demand.csv
            git commit -m "refresh eurostat gas figures"
            git push
            gh workflow run publish.yml
          else
            echo "No change in the Eurostat figures."
          fi
